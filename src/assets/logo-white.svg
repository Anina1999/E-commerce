<svg xmlns="http://www.w3.org/2000/svg" width="195" height="59" viewBox="0 0 195 59" role="img" aria-label="Tourashop">
  <!-- White variant of logo.svg for dark backgrounds (footer): negative space uses the footer graphite -->
  <defs>
    <!-- Cut a thin gap around the front peak out of the back peak, transparent on any background -->
    <mask id="gap">
      <rect width="60" height="59" fill="#fff" />
      <path d="M1 48 L22 13 L26 5.5 L29.2 12 L32 8.5 L37 18 L47 48 Z" fill="#000" stroke="#000" stroke-width="2.4" stroke-linejoin="round" />
    </mask>
  </defs>
  <path d="M22 48 L41 15.5 Q43 12.5 45 15.5 L58 48 Z" fill="#3d8b8f" mask="url(#gap)" />
  <path d="M1 48 L22 13 L26 5.5 L29.2 12 L32 8.5 L37 18 L47 48 Z" fill="#fff" />
  <path d="M29.2 12 L27.8 19 L23.5 30 L17.5 39 L23.8 34 L27.2 25 Z" fill="#1f2a33" />
  <rect x="4" y="51.5" width="50" height="2" rx="1" fill="#3d8b8f" />
  <rect x="15" y="55.5" width="28" height="2" rx="1" fill="#3d8b8f" />
  <!-- Wordmark -->
  <text x="66" y="31" textLength="124" lengthAdjust="spacingAndGlyphs"
        font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="800"
        fill="#fff">TOURASHOP</text>
  <text x="67" y="46" textLength="122" lengthAdjust="spacing"
        font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600"
        fill="#7cc4c7">OUTDOOR GEAR</text>
</svg>
